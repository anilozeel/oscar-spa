name: Deploy to oscarseasidehotel.com/spa (FTP)

# Vite+React build -> public_html/spa (GuzelHosting FTP).
# https://www.oscarseasidehotel.com/spa adresinde yayinlanir.
# HashRouter + base './' oldugundan alt yolda rewrite/htaccess gerekmez.
#
# GEREKEN (bir kez): Settings > Secrets and variables > Actions altinda
#   FTP_SERVER   = mt-kratos.guzelhosting.com
#   FTP_USERNAME = oscarse1
#   FTP_PASSWORD = (FTP sifresi)
# Bu uc secret eklenince her push otomatik yayinlanir.
#
# WhatsApp (Twilio) icin (bir kez) ayrica:
#   WA_TOKEN    = EAAG...  (Meta kalici WhatsApp erisim token'i - GIZLI)
#   WA_PHONE_ID = 1234567890  (WhatsApp telefon numarasi ID'si / Phone number ID)
#   WA_KEY      = (opsiyonel) ekstra paylasilan anahtar; bos birakilabilir
# Bu secret'ler eklenince deploy sirasinda public_html/spa/wa.config.json
# otomatik olusturulur; token repoya/tarayiciya girmez.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ftp-deploy-spa
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bagimliliklar + build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: SW surum damgasi (her deploy'da guncellensin)
        run: |
          echo "" >> dist/sw.js
          echo "// build: $(date -u +%Y%m%d%H%M%S) ${GITHUB_SHA::7}" >> dist/sw.js

      - name: WhatsApp Cloud API config olustur (gizli, loglanmaz)
        env:
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_KEY: ${{ secrets.WA_KEY }}
        run: |
          cat > dist/wa.config.json <<EOF
          {
            "token": "${WA_TOKEN}",
            "phone_id": "${WA_PHONE_ID}",
            "key": "${WA_KEY}"
          }
          EOF
          if [ -n "$WA_TOKEN" ] && [ -n "$WA_PHONE_ID" ]; then
            echo "wa.config.json olusturuldu (token uzunluk: ${#WA_TOKEN}, phone_id uzunluk: ${#WA_PHONE_ID})"
          else
            echo "UYARI: WA_TOKEN/WA_PHONE_ID secret'leri bos — WhatsApp gonderimi pasif kalir."
          fi

      - name: Yukle - /spa (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: ./public_html/spa/
