name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web (Vite)
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OscarSpa.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OscarSpa-APK
          path: OscarSpa.apk

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: OscarSpa — Android APK
          body: |
            OscarSpa Android uygulaması (debug imzalı, yan yükleme için).
            Telefona indirip kurun (Ayarlar → bilinmeyen kaynaklara izin verin).
          files: OscarSpa.apk
