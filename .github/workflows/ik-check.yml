name: IK Live Check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Oscar IK live
        run: |
          set -e
          B="https://oscarseasidehotel.com/ik"
          echo "== logo.png =="
          code=$(curl -s -o /dev/null -w '%{http_code}' "$B/logo.png"); echo "logo HTTP $code"; test "$code" = "200"
          echo "== index.html: logo app'e eklendi mi + demo veri temiz mi =="
          curl -s "$B/" > /tmp/ix.html
          grep -q 'class="brand-logo"' /tmp/ix.html && echo "OK: brand-logo (giris+menu logosu) var" || { echo "FAIL: logo yok"; exit 1; }
          for bad in "Mehmet Yıldız" "42 aktif personel" "Derya Öztürk" "Caner Aydın" "1.248.500"; do
            if grep -q "$bad" /tmp/ix.html; then echo "FAIL: demo veri hala var -> $bad"; exit 1; fi
          done
          echo "OK: demo veriler temizlendi"
          echo "== belge hepsi 12 sayfa + api =="
          curl -s "$B/belge.php?type=hepsi&id=p1" | grep -c 'class="page"' | xargs echo "hepsi sayfa:"
          curl -s "$B/api.php?fn=list" | python3 -c "import sys,json;d=json.load(sys.stdin);print('personel:',len(d['rows']))"
          echo "== HEPSI BASARILI =="
