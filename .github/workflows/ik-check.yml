name: IK Live Check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify rapor + kur + bilgin
        run: |
          set -e
          B="https://oscarseasidehotel.com/ik"
          KEY=$(curl -s "$B/api.php?fn=login" -X POST -H 'Content-Type: application/json' -d '{"u":"cigdem","p":"cigdem.123"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["key"])')
          H="X-IK-KEY: $KEY"; CT="Content-Type: application/json"
          echo "== bilgin adı/rolü (ensureUsers) =="
          curl -s "$B/api.php?fn=users" | python3 -c 'import sys,json;d=json.load(sys.stdin);b=[u for u in d["users"] if u["u"]=="bilgin"][0];assert b["name"]=="Bilgin Ünsal",b["name"];assert b["role"]=="Otel Müdürü";print("OK:",b["name"],b["role"])'
          echo "== kur ayarla =="
          curl -s "$B/api.php?fn=ratesset" -X POST -H "$H" -H "$CT" -d '{"usd":35,"eur":38}' | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d["usd"]==35;print("OK kur usd=",d["usd"],"eur=",d["eur"])'
          echo "== rapor ucu =="
          curl -s "$B/api.php?fn=rapor&k=$KEY" | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d["ok"];print("OK rapor: ay",d["ay"],"| personel",len(d["rows"]),"| ornek netAlacakTL",d["rows"][0]["netAlacakTL"] if d["rows"] else "-")'
          echo "== rapor.php yetki =="
          test "$(curl -s -o /dev/null -w '%{http_code}' "$B/rapor.php?k=$KEY")" = "200" && echo "OK rapor.php 200 (key)"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$B/rapor.php")" = "403" && echo "OK rapor.php 403 (keysiz)"
          echo "== HEPSI BASARILI =="
