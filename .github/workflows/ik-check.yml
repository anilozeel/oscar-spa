name: IK Live Check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Oscar IK live
        run: |
          set -e
          B="https://oscarseasidehotel.com/ik"
          KEY=$(curl -s "$B/api.php?fn=login" -X POST -H 'Content-Type: application/json' -d '{"u":"cigdem","p":"cigdem.123"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["key"])')
          echo "key alindi"
          echo "== oryantasyon: list migrasyonu (yeni nesne modeli) =="
          curl -s "$B/api.php?fn=list" | python3 -c "import sys,json;d=json.load(sys.stdin);o=d['rows'][0]['oryantasyon'];assert isinstance(o,list) and (len(o)==0 or isinstance(o[0],dict)),'migrasyon yok';print('madde ornegi:',o[0] if o else 'bos')"
          echo "== oryantasyon: gorev/egitim ekle =="
          r=$(curl -s "$B/api.php?fn=orientadd" -X POST -H "X-IK-KEY: $KEY" -H 'Content-Type: application/json' -d '{"id":"p1","tur":"egitim","baslik":"Canli test egitimi"}')
          echo "$r" | grep -q '"ok":true' && echo "OK orientadd" || { echo "FAIL $r"; exit 1; }
          IID=$(echo "$r" | python3 -c 'import sys,json;print(json.load(sys.stdin)["item"]["iid"])')
          curl -s "$B/api.php?fn=orient" -X POST -H "X-IK-KEY: $KEY" -H 'Content-Type: application/json' -d "{\"id\":\"p1\",\"iid\":\"$IID\",\"done\":true,\"sonuc\":\"test sonuc\"}" | grep -q '"ok":true' && echo "OK orient set" || { echo FAIL; exit 1; }
          curl -s "$B/api.php?fn=orientdel" -X POST -H "X-IK-KEY: $KEY" -H 'Content-Type: application/json' -d "{\"id\":\"p1\",\"iid\":\"$IID\"}" | grep -q '"ok":true' && echo "OK orientdel (temizlendi)" || { echo FAIL; exit 1; }
          echo "== brosur gorselleri + QR =="
          for f in shot-dash.png shot-shift.png shot-perf.png shot-qr.png; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "$B/$f"); echo "$f -> $c"; test "$c" = "200"
          done
          curl -s "$B/tanitim.php" | grep -q 'Personel Self-Serv' && echo "OK tanitim self-servis bolumu" || { echo FAIL; exit 1; }
          echo "== HEPSI BASARILI =="
