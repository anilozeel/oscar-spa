name: IK Live Check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify izin + sifre + silme
        run: |
          set -e
          B="https://oscarseasidehotel.com/ik"
          KEY=$(curl -s "$B/api.php?fn=login" -X POST -H 'Content-Type: application/json' -d '{"u":"cigdem","p":"cigdem.123"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["key"])')
          H="X-IK-KEY: $KEY"; CT="Content-Type: application/json"
          # create temp personnel
          R=$(curl -s "$B/api.php?fn=save" -X POST -H "$H" -H "$CT" -d '{"ad":"Sil","soyad":"Test","departman":"Test","pozisyon":"Test","gorev":"Test"}')
          NID=$(echo "$R"|python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          PU=$(echo "$R"|python3 -c 'import sys,json;print(json.load(sys.stdin)["account"]["kullanici"])')
          PP=$(echo "$R"|python3 -c 'import sys,json;print(json.load(sys.stdin)["account"]["sifre"])')
          PT=$(curl -s "$B/api.php?fn=plogin" -X POST -H "$CT" -d "{\"u\":\"$PU\",\"p\":\"$PP\"}" | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          echo "== izin talebi (gün+saat+sebep) =="
          curl -s "$B/api.php?fn=izinadd" -X POST -H "X-IK-PTOKEN: $PT" -H "$CT" -d "{\"pid\":\"$NID\",\"tarih\":\"14.03.2026\",\"saat\":\"13:00-17:00\",\"sebep\":\"doktor\"}" | grep -q '"ok":true' && echo "OK izinadd"
          curl -s "$B/api.php?fn=izinall&k=$KEY" | python3 -c 'import sys,json;d=json.load(sys.stdin);a=[x for x in d["izin"] if x["pid"]=="'$NID'"][0];print("OK izinall:",a["tarih"],a["saat"],a["durum"])'
          echo "== personel şifre değiştir =="
          curl -s "$B/api.php?fn=pchpass" -X POST -H "X-IK-PTOKEN: $PT" -H "$CT" -d "{\"pid\":\"$NID\",\"yeni\":\"yeni9988\"}" | grep -q '"ok":true' && echo "OK pchpass"
          curl -s "$B/api.php?fn=plogin" -X POST -H "$CT" -d "{\"u\":\"$PU\",\"p\":\"yeni9988\"}" | grep -q '"ok":true' && echo "OK yeni şifreyle giriş"
          echo "== personel sil =="
          curl -s "$B/api.php?fn=delete" -X POST -H "$H" -H "$CT" -d "{\"id\":\"$NID\"}" | grep -q '"ok":true' && echo "OK delete"
          curl -s "$B/api.php?fn=get&id=$NID" | grep -q '"ok":false' && echo "OK silindi (bulunamadı)"
          echo "== HEPSI BASARILI =="
