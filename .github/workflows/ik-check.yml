name: IK Live Check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Oscar IK live
        run: |
          set -e
          B="https://oscarseasidehotel.com/ik"
          echo "== logo.png =="
          code=$(curl -s -o /dev/null -w '%{http_code}' "$B/logo.png"); echo "logo HTTP $code"; test "$code" = "200"
          echo "== api list =="
          curl -s "$B/api.php?fn=list" | python3 -c "import sys,json; d=json.load(sys.stdin); print('personel:',len(d['rows'])); assert d['ok']"
          echo "== belge hepsi (tum evraklar) id=p1 =="
          H=$(curl -s "$B/belge.php?type=hepsi&id=p1")
          echo "$H" | grep -c 'class="page"' | xargs echo "sayfa sayisi:"
          for t in "BELIRSIZ SURELI" "ORYANTASYON FORMU" "FAZLA MESAI" "KVKK AYDINLATMA" "KORUNMASI PROTOKOLU" "UNIFORMA TALEP" "LOJMAN KULLANIM" "LOJMAN YERLESIM"; do
            echo "$H" | grep -qi "$t" && echo "OK: $t" || { echo "MISSING: $t"; exit 1; }
          done
          echo "== pozisyon otomatik dolum (p5 Resepsiyonist) =="
          S=$(curl -s "$B/belge.php?type=sozlesme&id=p5")
          echo "$S" | grep -q "Resepsiyonist" && echo "OK: pozisyon dolu" || { echo "FAIL pozisyon"; exit 1; }
          echo "$S" | grep -q "GOK" && { echo "NOTE old-name check skipped"; } || echo "OK"
          echo "== HEPSI BASARILI =="
