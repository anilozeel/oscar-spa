name: IK Live Check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Oscar IK live
        run: |
          set -e
          B="https://oscarseasidehotel.com/ik"
          echo "== kullanıcı girişleri =="
          for creds in "cigdem:cigdem.123:Ana Admin" "bilgin:bilgin.123:Otel" "admin:demo1234:Admin"; do
            u=$(echo $creds|cut -d: -f1); p=$(echo $creds|cut -d: -f2)
            r=$(curl -s "$B/api.php?fn=login" -X POST -H 'Content-Type: application/json' -d "{\"u\":\"$u\",\"p\":\"$p\"}")
            echo "$r" | grep -q '"ok":true' && echo "OK giris: $u" || { echo "FAIL giris: $u -> $r"; exit 1; }
          done
          echo "== users ucu =="
          curl -s "$B/api.php?fn=users" | python3 -c "import sys,json;d=json.load(sys.stdin);print('kullanici:',[x['u'] for x in d['users']]);assert len(d['users'])>=3"
          echo "== vardiya.php =="
          curl -s "$B/vardiya.php" > /tmp/v.html
          grep -q 'Haftalık Vardiya' /tmp/v.html && echo "OK vardiya sayfasi" || { echo FAIL; exit 1; }
          grep -q 'PNG indir' /tmp/v.html && grep -q 'JPEG indir' /tmp/v.html && echo "OK PNG/JPEG butonlari" || { echo "FAIL indirme butonu"; exit 1; }
          grep -q 'html2canvas' /tmp/v.html && echo "OK html2canvas" || echo "uyari: html2canvas yok"
          echo "== belge logo gömülü (data-uri) =="
          curl -s "$B/belge.php?type=sozlesme&id=p1" | grep -q "data:image/png;base64" && echo "OK logo gömülü" || { echo "FAIL logo gomulu degil"; exit 1; }
          echo "== HEPSI BASARILI =="
