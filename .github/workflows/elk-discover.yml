name: Spa Elektra kesif

on:
  workflow_dispatch:
    inputs:
      resid:
        description: "Oscar Spa folyo RESID (bos birak = sadece kesif)"
        default: ""
      test_amount:
        description: "Test adisyonu tutari (0 = test yok)"
        default: "0"

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: setspa + kesif + test
        env:
          RESID: ${{ github.event.inputs.resid }}
          TAMT: ${{ github.event.inputs.test_amount }}
        run: |
          BASE="https://www.oscarseasidehotel.com/menu/api.php"
          if [ -n "$RESID" ]; then
            echo "== setspa (spa_resid=$RESID) =="
            curl -s -X POST "$BASE?fn=setspa" -H "Content-Type: application/json" -d "{\"spa_resid\":\"$RESID\"}"; echo
          fi
          echo "== spadiscover (resolved + centers) =="
          curl -s "$BASE?fn=spadiscover" | python3 -c "import sys,json; d=json.load(sys.stdin); print('RESOLVED:',json.dumps(d.get('resolved',{}),ensure_ascii=False)); print('CENTERS:'); [print('  ',c.get('code'),c.get('type'),c.get('name')) for c in d.get('centers',[])]" || echo "(hata)"
          if [ "$TAMT" != "0" ] && [ -n "$TAMT" ]; then
            echo "== spasanal TEST ($TAMT TL, Kredi Karti) =="
            curl -s -X POST "$BASE?fn=spasanal" -H "Content-Type: application/json" \
              -d "{\"amount\":$TAMT,\"service\":\"TEST - silinebilir\",\"pm\":\"Kredi Kartı\",\"guest\":\"Test\"}"; echo
          fi
