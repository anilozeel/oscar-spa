name: Spa canli JS kontrol

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Surum + spalog
        run: |
          HTML=$(curl -s "https://www.oscarseasidehotel.com/spa/index.html")
          JS=$(echo "$HTML" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          echo "JS: $JS"
          BODY=$(curl -s "https://www.oscarseasidehotel.com/spa/$JS")
          echo "fn=spasanal      : $(echo "$BODY" | grep -oc 'fn=spasanal')"
          echo "toast 'folyosuna': $(echo "$BODY" | grep -oc 'folyosuna')"
          echo "deleteSale izi   : $(echo "$BODY" | grep -oc 'Adisyon silindi')"
          echo "== spalog (son spasanal denemeleri) =="
          curl -s "https://www.oscarseasidehotel.com/menu/api.php?fn=spalog"; echo
