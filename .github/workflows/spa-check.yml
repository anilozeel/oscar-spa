name: Spa canli JS kontrol

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Canli spa JS'inde spasanal var mi
        run: |
          echo "== index.html =="
          HTML=$(curl -s "https://www.oscarseasidehotel.com/spa/index.html")
          echo "$HTML" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head
          JS=$(echo "$HTML" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          echo "JS: $JS"
          echo "== JS icinde arama =="
          BODY=$(curl -s "https://www.oscarseasidehotel.com/spa/$JS")
          echo "spasanal : $(echo "$BODY" | grep -c spasanal)"
          echo "menu/api : $(echo "$BODY" | grep -c 'menu/api.php')"
          echo "postSpaElektra-izi (fn=spasanal): $(echo "$BODY" | grep -oc 'fn=spasanal')"
