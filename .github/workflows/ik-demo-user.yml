name: IK Demo Personel
on: workflow_dispatch
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Create demo personnel personel/1234
        run: |
          set -e
          B="https://oscarseasidehotel.com/ik"
          KEY=$(curl -s "$B/api.php?fn=login" -X POST -H 'Content-Type: application/json' -d '{"u":"cigdem","p":"cigdem.123"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["key"])')
          H="X-IK-KEY: $KEY"; CT="Content-Type: application/json"
          echo "== mevcut 'personel' kullanıcısı var mı? =="
          EXIST=$(curl -s "$B/api.php?fn=list" | python3 -c "import sys,json;d=json.load(sys.stdin);print(next((r['id'] for r in d['rows'] if str(r.get('kullanici','')).lower()=='personel'),''))")
          if [ -n "$EXIST" ]; then
            echo "Zaten var: $EXIST — şifre 1234 olarak ayarlanıyor"
            curl -s "$B/api.php?fn=save" -X POST -H "$H" -H "$CT" -d "{\"id\":\"$EXIST\",\"kullanici\":\"personel\",\"sifre\":\"1234\"}" | python3 -c 'import sys,json;print("guncellendi:",json.load(sys.stdin).get("ok"))'
          else
            echo "Yeni demo personel oluşturuluyor"
            curl -s "$B/api.php?fn=save" -X POST -H "$H" -H "$CT" -d '{"ad":"Demo","soyad":"Personel","kullanici":"personel","sifre":"1234","departman":"Ön Büro","pozisyon":"Demo Personel","gorev":"Demo Personel","iseGiris":"01.09.2026","ucret":"30000"}' | python3 -c 'import sys,json;d=json.load(sys.stdin);print("olusturuldu id:",d.get("id"))'
          fi
          echo "== personel girişi doğrula =="
          curl -s "$B/api.php?fn=plogin" -X POST -H "$CT" -d '{"u":"personel","p":"1234"}' | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d.get("ok"),"login FAIL";print("OK plogin:",d["name"],"| pid:",d["pid"])'
          echo "== DEMO HAZIR: personel / 1234 =="
