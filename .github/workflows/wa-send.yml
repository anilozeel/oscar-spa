name: WhatsApp test gonder

on:
  workflow_dispatch:
    inputs:
      to:
        description: "Alici numara"
        default: "0553 502 94 50"

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Ornek sablonla gonderim (trial uyumlu)
        env:
          TW_SID: ${{ secrets.TWILIO_SID }}
          TW_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TO: ${{ github.event.inputs.to }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.parse, urllib.error, re
          sid=os.environ["TW_SID"]; tok=os.environ["TW_TOKEN"]
          d=re.sub(r"\D","",os.environ["TO"])
          e164 = "+"+d if d.startswith("90") else ("+90"+d[1:] if d.startswith("0") else ("+90"+d if len(d)==10 else "+"+d))
          FROM="whatsapp:+17372508034"; TO="whatsapp:"+e164
          auth=base64.b64encode(f"{sid}:{tok}".encode()).decode()
          url=f"https://api.twilio.com/2010-04-01/Accounts/{sid}/Messages.json"
          # Twilio'nun herkese acik ornek sablonu: "Your appointment is coming up on {{1}} at {{2}}"
          CSID="HXb5b62575e6e4ff6129ad7c8efe1f983e"
          sends=[
            ("MUSTERI", {"1":"7 Ekim","2":"15:00 - Klasik Masaj (Paket)"}),
            ("TERAPIST", {"1":"7 Ekim - Yeni randevu (Anıl Özel)","2":"15:00 Klasik Masaj (Paket)"}),
          ]
          for label,vars in sends:
              data=urllib.parse.urlencode({"From":FROM,"To":TO,"ContentSid":CSID,"ContentVariables":json.dumps(vars)}).encode()
              r=urllib.request.Request(url,data=data,method="POST")
              r.add_header("Authorization","Basic "+auth)
              r.add_header("Content-Type","application/x-www-form-urlencoded")
              try:
                  with urllib.request.urlopen(r) as resp: code,body=resp.status,json.loads(resp.read().decode())
              except urllib.error.HTTPError as ex: code,body=ex.code,json.loads(ex.read().decode())
              print(f"== {label} (HTTP {code}) ==", json.dumps({k:body.get(k) for k in ("sid","status","error_code","message")}, ensure_ascii=False))
          PY
